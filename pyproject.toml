[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-injection-nn"
version = "0.1.0"
description = "Compact prompt-injection detector for retrieved documents, tool results and agent messages. No LLM."
readme = "src/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7", "pandas>=2.0", "pyarrow>=14", "pydantic>=2"]   # pydantic: the Open WebUI filter under test declares its valves with it
hf = ["transformers>=4.48", "tokenizers>=0.21"]                      # the hf_guard backend (Open WebUI's image already has these)

[project.scripts]
prompt-injection-nn = "prompt_injection_nn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
